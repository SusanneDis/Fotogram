<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotogram</title>
  <link rel="icon" type="icons/png" href="./icons/favicon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <header>
    <div class="adjust-width-center">
          <img aria-label="Fotogram Logo" src="./icons/Fotogram_Logo.svg" alt="Logo Fotogram">
    </div>    
  </header>

  <main id="tabMain">
    <h1 id="headline" tabindex="0"  class="adjust-width-center">McLaren 765 LT Spider</h1>

    <section title="Fotogalerie McLaren 765 LT Spider" aria-label="Fotogalerie McLaren 765 LT Spider"
      class="photo-gallery adjust-width-center">
      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(0)">
        <img src="./img/1-mclaren-765-lt-spider-orange-front-wing-doors.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange frontal mit offenen Flügeltüren">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(1)">
        <img src="./img/2-mclaren-765-lt-spider-orange-front-wing-doors2.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Frontsicht mit offenen Flügeltüren">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(2)">
        <img src="./img/3-mclaren-765-lt-spider-orange-exhaust-2.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Hecksicht mit Abgasanlage">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(3)">
        <img src="./img/4-mclaren-765-lt-spider-orange-long-shot-side.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange in der Totale">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(4)">
        <img src="./img/5-mclaren-765-lt-spider-orange-rear-3.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange mit Sicht auf das Heck">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(5)">
        <img src="./img/6-mclaren-765-lt-spider-orange-steering-wheel.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Detailansicht Lenkrad">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(6)">
        <img src="./img/7-mclaren-765-lt-spider-orange-wheel-rim.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Detailansicht Felge">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(7)">
        <img src="./img/8-mclaren-765-lt-spider-orange-front-headlights.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange frontal Scheinwerfer">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(8)">
        <img src="./img/9-mclaren-765-lt-spider-orange-front.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Frontansicht offene Flügeltüren">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(9)">
        <img src="./img/10-mclaren-765-lt-spider-orange-interior.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Blick auf Cockpit und Lenkrad">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(10)">
        <img src="./img/11-mclaren-765-lt-spider-orange-wing-door.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Flügeltüre mit Modellname">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(11)">
        <img src="./img/12-mclaren-765-lt-spider-orange-detail-brand.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Modellname">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(12)">
        <img src="./img/13-mclaren-765-lt-spider-orange-detail-rear.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Sicht auf Heck mit Luftansauger">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(13)">
        <img src="./img/14-mclaren-765-lt-spider-orange-front-shot.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange frontal-seitlich offene Flügeltüren">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(14)">
        <img src="./img/15-mclaren-765-lt-spider-orange-front-brand.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Front Brand">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(15)">
        <img src="./img/16-mclaren-765-lt-spider-orange-long-shot-2.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange frontal-seitlich Totale">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(16)">
        <img src="./img/17-mclaren-765-lt-spider-orange-steering-wheel-detail.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Detailansicht Lenkrad">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(17)">
        <img src="./img/18-mclaren-765-lt-spider-orange-wheel-rim-detail.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Detailansicht Reifen Felgen mit Modellname">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(18)">
        <img src="./img/19-mclaren-765-lt-spider-orange-rear.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Heck Rücklichter Nahaufnahme">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(19)">
        <img src="./img/20-mclaren-765-lt-spider-orange-rear-2.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Heck Halbnahaufnahme">
      </button>

      <button aria-haspopup="dialog" aria-controls="openDialogRef" tabindex="0" onclick="openDialog(20)">
        <img src="./img/21-mclaren-765-lt-spider-orange-side-wing-doors.jpg" class="image-size"
          alt="McLaren 765 LT Spider orange Totale seitlich offene Flügeltüren">
      </button>
    </section>

    <section aria-label="Dialog">
      <dialog id="openDialogRef" class="open-dialog">
        <figure class="dialog-content">
          <button title="Bild wechseln nach links" class="arrow arrow-left" tabindex="0"
            aria-label="Bild wechseln nach links" onclick="showImage(currentIndex - 1)"><span>&#10094;</span></button>
          <button title="Bild wechseln nach rechts" class="arrow arrow-right" tabindex="0"
            aria-label="Bild wechseln nach rechts" onclick="showImage(currentIndex + 1)"><span>&#10095;</span></button>
          <button id="closeDialogRef" title="Dialog schliessen" class="x-dialog" tabindex="0"
            aria-label="Dialog schliessen" onclick="closeDialog()"><span>&#215;</span></button>
          <div id="imageRef" class="image-box"></div>
        </figure>
      </dialog>
    </section>

  </main>

  <footer aria-label="Footer" class="adjust-width-center">
    <p aria-label="Copyright-Hinweis">
      <small>&#169;2025 Susanne Di Sorbo. All Rights reserved
      </small>
    </p>
  </footer>

</body>

</html>
